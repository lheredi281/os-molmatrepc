<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consola Táctil FIBA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-light: rgba(255, 255, 255, 0.1);
            
            --green-btn: linear-gradient(145deg, #22c55e, #16a34a);
            --green-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            
            --blue-btn: linear-gradient(145deg, #3b82f6, #2563eb);
            --blue-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            
            --red-btn: linear-gradient(145deg, #ef4444, #dc2626);
            --red-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            
            --yellow-btn: linear-gradient(145deg, #facc15, #ca8a04);
            --yellow-shadow: 0 4px 20px rgba(234, 179, 8, 0.5);
            
            --dark-btn: linear-gradient(145deg, #334155, #1e293b);
            --dark-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            
            --purple-btn: linear-gradient(145deg, #a855f7, #7e22ce);
            --purple-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 50% -20%, #1e293b, #0f172a 80%);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: stretch;
            padding: 20px;
            overflow: hidden;
        }

                .dashboard {
            position: absolute;
            top: 50%; left: 50%;
            width: 1200px; height: 750px;
            transform: translate(-50%, -50%);
            display: flex; gap: 20px;
        }

        /* Glass Panels */
        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 25px;
            display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .panel.side { flex: 1; }
        .panel.center { flex: 1.5; }

        .panel-header {
            text-align: center; font-size: 22px; font-weight: 800;
            letter-spacing: 4px; padding-bottom: 15px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-light);
            text-transform: uppercase;
        }
        .header-local { color: #4ade80; text-shadow: 0 0 10px rgba(74,222,128,0.5); }
        .header-visita { color: #60a5fa; text-shadow: 0 0 10px rgba(96,165,250,0.5); }
        .header-mesa { color: #f8fafc; }

        /* Buttons Structure */
        .btn-grid {
            display: flex; flex-direction: column; gap: 20px; flex: 1;
            justify-content: center;
        }
        .row { display: flex; justify-content: space-evenly; gap: 15px; width: 100%; }
        
        .control-group {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }

        .label {
            font-size: 12px; font-weight: 600; color: #94a3b8;
            letter-spacing: 1px; text-transform: uppercase;
        }

        /* Modern Buttons */
        button {
            border: none; outline: none; cursor: pointer;
            border-radius: 16px;
            color: white; font-weight: 800; font-family: 'Inter', sans-serif;
            font-size: 24px;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.1s, box-shadow 0.1s, filter 0.2s;
            position: relative; overflow: hidden;
        }
        
        button::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(255,255,255,0.1), transparent);
            border-radius: 16px; pointer-events: none;
        }

        button:active {
            transform: scale(0.95);
            filter: brightness(0.9);
        }

        /* Button Colors */
        .btn-green { background: var(--green-btn); box-shadow: var(--green-shadow); border: 1px solid #4ade80; }
        .btn-blue { background: var(--blue-btn); box-shadow: var(--blue-shadow); border: 1px solid #60a5fa; }
        .btn-red { background: var(--red-btn); box-shadow: var(--red-shadow); border: 1px solid #f87171; }
        .btn-yellow { background: var(--yellow-btn); box-shadow: var(--yellow-shadow); border: 1px solid #fde047; color: #1c1917;}
        .btn-dark { background: var(--dark-btn); box-shadow: var(--dark-shadow); border: 1px solid #475569; }
        .btn-purple { background: var(--purple-btn); box-shadow: var(--purple-shadow); border: 1px solid #c084fc; }

        /* Sizes */
        .btn-square { width: 80px; height: 80px; }
        .btn-rect { width: 100px; height: 60px; font-size: 18px; }
        .btn-wide { width: 140px; height: 60px; font-size: 18px; }
        .btn-huge { width: 120px; height: 120px; border-radius: 50%; font-size: 40px; }
        .btn-huge::after { border-radius: 50%; }

        /* Icons SVG */
        svg { width: 32px; height: 32px; fill: currentColor; }
        .btn-huge svg { width: 50px; height: 50px; }

        /* Center Dashboard specific */
        .center-dashboard { display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
        
        .time-box {
            background: rgba(0,0,0,0.3); border: 1px solid #334155;
            border-radius: 16px; padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
            opacity: 0.4; pointer-events: none; transition: all 0.3s ease;
        }
        body.edit-mode .time-box {
            opacity: 1; pointer-events: auto;
            border-color: #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }

        .status-bar {
            background: #0f172a; border-radius: 12px; padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #1e293b; margin-top: auto;
        }
        
        .led { width: 12px; height: 12px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 8px #ef4444; transition: 0.3s; }
        .led.green { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .led.yellow { background: #facc15; box-shadow: 0 0 8px #facc15; }
        
        .status-text { font-family: 'Share Tech Mono', monospace; color: #38bdf8; font-size: 18px; }

    </style>
</head>
<body>

    <div class="dashboard">
        
        <!-- LOCAL PANEL -->
        <div class="panel side">
            <div class="panel-header header-local">LOCAL</div>
            <div class="btn-grid">
                <!-- Puntos -->
                <div class="row">
                    <div class="control-group">
                        <span class="label">+1 PTS</span>
                        <button class="btn-square btn-green" onclick="sendCmd(1, 1, 0, 1)">+1</button>
                    </div>
                    <div class="control-group">
                        <span class="label">+2 PTS</span>
                        <button class="btn-square btn-green" onclick="sendCmd(1, 1, 0, 2)">+2</button>
                    </div>
                    <div class="control-group">
                        <span class="label">+3 PTS</span>
                        <button class="btn-square btn-green" onclick="sendCmd(1, 1, 0, 3)">+3</button>
                    </div>
                </div>
                <!-- Correccion Puntos -->
                <div class="row">
                    <div class="control-group">
                        <span class="label">CORREGIR PUNTO</span>
                        <button class="btn-wide btn-dark" onclick="sendCmd(1, 1, 0, 255)">-1</button>
                    </div>
                </div>
                
                <div style="height: 1px; background: var(--border-light); margin: 10px 0;"></div>
                
                <!-- Faltas -->
                <div class="row">
                    <div class="control-group">
                        <span class="label" style="color: #f87171;">FALTA</span>
                        <button class="btn-square btn-red" onclick="sendCmd(3, 1, 0, 1)">+1</button>
                    </div>
                    <div class="control-group">
                        <span class="label">CORREGIR</span>
                        <button class="btn-square btn-dark" onclick="sendCmd(3, 1, 0, 255)">-1</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- CENTER PANEL (MESA) -->
        <div class="panel center">
            <div class="panel-header header-mesa">MESA DE CONTROL</div>
            
            <div class="center-dashboard">
                <!-- Main Controls -->
                <div class="row" style="align-items: center; margin-bottom: 20px;">
                    <div class="control-group">
                        <span class="label" style="color: #a855f7;">EDITAR (SHIFT)</span>
                        <button class="btn-rect btn-purple" id="btn-comando" onclick="toggleEditMode()">
                            <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                        </button>
                    </div>

                    <div class="control-group" style="flex-direction: row; gap: 20px;">
                        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                            <span class="label" style="color: #4ade80; font-size: 16px;">START</span>
                            <button class="btn-huge btn-green" onclick="handleStart()">
                                <svg viewBox="0 0 24 24" style="fill: #1c1917;"><path d="M8 5v14l11-7z"/></svg>
                            </button>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
                            <span class="label" style="color: #f87171; font-size: 16px;">STOP</span>
                            <button class="btn-huge btn-red" onclick="handleStop()">
                                <svg viewBox="0 0 24 24" style="fill: white;"><path d="M6 6h12v12H6z"/></svg>
                            </button>
                        </div>
                    </div>
                    <span class="label" style="font-size: 10px; color: #a855f7; margin-top: -10px;">+ EDITAR EN START = RESET PARTIDO</span>

                    <div class="control-group">
                        <span class="label" style="color: #f87171;">BOCINA</span>
                        <button class="btn-rect btn-red" onclick="sendCmd(6, 0, 0, 0)">
                            <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zm2 4v6c1.33 0 2-.67 2-3s-.67-3-2-3z"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Time Controls (Locked by default) -->
                <div class="time-box">
                    <div class="row">
                        <div class="control-group">
                            <span class="label">1 MIN</span>
                            <button class="btn-rect btn-dark" onclick="sendCmd(7, 1, 0, 0)">1:00</button>
                        </div>
                        <div class="control-group">
                            <span class="label">5 MIN</span>
                            <button class="btn-rect btn-dark" onclick="sendCmd(7, 5, 0, 0)">5:00</button>
                        </div>
                        <div class="control-group">
                            <span class="label">10 MIN</span>
                            <button class="btn-rect btn-dark" onclick="sendCmd(7, 10, 0, 0)">10:00</button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="control-group">
                            <button class="btn-rect btn-dark" onclick="sendCmd(8, 0, 0, 1)">+1 MIN</button>
                        </div>
                        <div class="control-group">
                            <button class="btn-rect btn-dark" onclick="sendCmd(8, 0, 0, 255)">-1 MIN</button>
                        </div>
                    </div>
                </div>

                <!-- Bottom Controls -->
                <div class="row" style="margin-top: 20px;">
                    <div class="control-group">
                        <span class="label">PERIODO</span>
                        <div style="display:flex; gap:10px;">
                            <button class="btn-rect btn-dark" onclick="sendCmd(5, 0, 0, 1)">+1</button>
                            <button class="btn-rect btn-dark" onclick="sendCmd(5, 0, 0, 255)">-1</button>
                        </div>
                    </div>

                    <div style="width: 1px; background: var(--border-light);"></div>

                    <div class="control-group">
                        <span class="label" style="color: #4ade80;">VINCULAR (SYNC)</span>
                        <div style="display:flex; gap:10px;">
                            <button class="btn-rect btn-dark" style="border-color: #4ade80;" onclick="handleSync()">SYNC</button>
                            <button class="btn-rect btn-dark" style="border-color: #f87171;" onclick="handleUnpair()">UNPAIR</button>
                        </div>
                    </div>
                </div>

                <!-- Status Bar -->
                <div class="status-bar">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="label">ESTADO RED</span>
                        <div id="sync-led" class="led"></div>
                    </div>
                    <span id="mando-dash-text" class="status-text">ESPERANDO...</span>
                </div>
            </div>
        </div>

        <!-- VISITA PANEL -->
        <div class="panel side">
            <div class="panel-header header-visita">VISITA</div>
            <div class="btn-grid">
                <!-- Puntos -->
                <div class="row">
                    <div class="control-group">
                        <span class="label">+1 PTS</span>
                        <button class="btn-square btn-blue" onclick="sendCmd(1, 2, 0, 1)">+1</button>
                    </div>
                    <div class="control-group">
                        <span class="label">+2 PTS</span>
                        <button class="btn-square btn-blue" onclick="sendCmd(1, 2, 0, 2)">+2</button>
                    </div>
                    <div class="control-group">
                        <span class="label">+3 PTS</span>
                        <button class="btn-square btn-blue" onclick="sendCmd(1, 2, 0, 3)">+3</button>
                    </div>
                </div>
                <!-- Correccion Puntos -->
                <div class="row">
                    <div class="control-group">
                        <span class="label">CORREGIR PUNTO</span>
                        <button class="btn-wide btn-dark" onclick="sendCmd(1, 2, 0, 255)">-1</button>
                    </div>
                </div>
                
                <div style="height: 1px; background: var(--border-light); margin: 10px 0;"></div>
                
                <!-- Faltas -->
                <div class="row">
                    <div class="control-group">
                        <span class="label" style="color: #f87171;">FALTA</span>
                        <button class="btn-square btn-red" onclick="sendCmd(3, 2, 0, 1)">+1</button>
                    </div>
                    <div class="control-group">
                        <span class="label">CORREGIR</span>
                        <button class="btn-square btn-dark" onclick="sendCmd(3, 2, 0, 255)">-1</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const { ipcRenderer } = require('electron');

        function sendCmd(cmd, team, player, value) {
            ipcRenderer.send('virtual-command', { cmd, team, player, value });
        }

        let isEditMode = false;
        
        function handleStartStop() {
            if (isEditMode) {
                // RESET TOTAL DEL PARTIDO
                if(confirm('¿Seguro que deseas RESETEAR EL PARTIDO a 0?')) {
                    sendCmd(9, 0, 0, 0);
                    toggleEditMode(); // Auto-lock again
                }
            } else {
                // INICIAR / PAUSAR RELOJ
                sendCmd(4, 0, 0, 0);
            }
        }

        function handleSync() {
            sendCmd(153, 0, 0, 0);
            document.getElementById('sync-led').classList.add('yellow');
        }

        function handleUnpair() {
            if(confirm('¿Seguro que deseas desvincular este mando de la TV?')) {
                sendCmd(154, 0, 0, 0);
            }
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            if (isEditMode) {
                document.body.classList.add('edit-mode');
                document.getElementById('btn-comando').style.boxShadow = '0 0 20px #a855f7';
                document.getElementById('btn-comando').style.border = '2px solid #fff';
            } else {
                document.body.classList.remove('edit-mode');
                document.getElementById('btn-comando').style.boxShadow = '';
                document.getElementById('btn-comando').style.border = '';
            }
        }

        // Teclado
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Shift' && !isEditMode) toggleEditMode();
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'Shift' && isEditMode) toggleEditMode();
        });

        // Escuchar Hardware
        ipcRenderer.on('serial-command', (event, { cmd, team, player, value }) => {
            if (cmd === 200) {
                const dashText = document.getElementById('mando-dash-text');
                const led = document.getElementById('sync-led');
                
                dashText.innerText = `TVs: ${player} / Vinculadas: ${team}`;
                
                led.className = 'led'; // reset
                if (player > 0) {
                    led.classList.add('green');
                } else if (team > 0) {
                    // red is default
                }
            }
        });
            function autoScaleMando() {
            const dash = document.querySelector('.dashboard');
            if(dash) {
                const scale = Math.min(window.innerWidth / 1250, window.innerHeight / 800);
                dash.style.transform = `translate(-50%, -50%) scale($scale)`;
            }
        }
        window.addEventListener('resize', autoScaleMando);
        autoScaleMando();
    </script>
</body>
</html>
