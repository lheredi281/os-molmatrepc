<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero Anotador Kiosco - Montmartre Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800;900&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       TABLERO PROFESIONAL KIOSCO FIBA - MONTMARTRE ARENA
       - Modo Kiosco puro y simple (CERO publicidad, CERO ventanas extra).
       - Arranque automático desatendido en Linux / Pendrive / Windows.
       - Alto Contraste Solar: Negro absoluto (#000000) con acentos de estadio.
       - Cuadrícula 100% rígida: sin sobre-escala ni deformaciones.
       ========================================================================== */
    :root {
      --bg-black: #000000;
      --arena-card: #080a0f;
      --arena-card-inner: #020305;
      --border-dark: #1a1e28;
      
      --color-local: #00ff88;       /* Verde Neón */
      --color-local-glow: rgba(0, 255, 136, 0.4);
      --color-visita: #ff2247;      /* Rojo Neón */
      --color-visita-glow: rgba(255, 34, 71, 0.4);
      --color-clock: #ffd000;       /* Amarillo Solar Cancha */
      --color-clock-glow: rgba(255, 208, 0, 0.45);
      --color-period: #00e5ff;      /* Cian Eléctrico */
      --color-white: #ffffff;
      
      --led-off: #13161c;
      --led-on-amber: #ffd000;
      --led-on-red: #ff2247;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-variant-numeric: tabular-nums;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-black);
      color: var(--color-white);
      font-family: 'Chakra Petch', sans-serif;
      cursor: none;
    }

    /* CONTENEDOR FIJO DE PANTALLA COMPLETA */
    .arena-scoreboard {
      display: grid;
      width: 100vw;
      height: 100vh;
      grid-template-rows: 62px 1fr;
      padding: 12px;
      gap: 12px;
      position: relative;
    }

    /* 1. BARRA SUPERIOR CON COCKPIT DE MANDO */
    .arena-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: linear-gradient(180deg, #10141d 0%, #080a0f 100%);
      border: 2px solid #232938;
      border-radius: 8px;
      padding: 0 20px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-ball {
      width: 28px;
      height: 28px;
      background: radial-gradient(circle at 35% 35%, #ff9100 0%, #d84315 100%);
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(255, 145, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .brand-title {
      font-family: 'Teko', sans-serif;
      font-size: 36px;
      letter-spacing: 3px;
      line-height: 1;
      color: #ffffff;
    }

    .brand-title span {
      color: var(--color-period);
    }

    /* RADAR DE CONEXIÓN DEL MANDO */
    .mando-cockpit {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #020305;
      border: 2px solid #2a3142;
      padding: 6px 20px;
      border-radius: 30px;
      transition: all 0.3s ease;
    }

    .mando-cockpit.connected {
      border-color: var(--color-local);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.35);
    }

    .mando-cockpit.disconnected {
      border-color: var(--color-visita);
      box-shadow: 0 0 15px rgba(255, 34, 71, 0.3);
    }

    .radar-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #333d4e;
    }

    .mando-cockpit.connected .radar-dot {
      background: var(--color-local);
      box-shadow: 0 0 10px var(--color-local);
      animation: radarPulse 1.2s infinite;
    }

    .mando-cockpit.disconnected .radar-dot {
      background: var(--color-visita);
      box-shadow: 0 0 8px var(--color-visita);
    }

    @keyframes radarPulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    .mando-text {
      font-family: 'Teko', sans-serif;
      font-size: 26px;
      letter-spacing: 2.5px;
      line-height: 1;
    }

    .mando-cockpit.connected .mando-text {
      color: var(--color-local);
    }

    .mando-cockpit.disconnected .mando-text {
      color: var(--color-visita);
    }

    .header-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 1.5px;
    }

    /* 2. CUERPO PRINCIPAL RÍGIDO (36.5% | 27% | 36.5%) */
    .arena-grid {
      display: grid;
      grid-template-columns: 36.5% 27% 36.5%;
      gap: 12px;
      width: 100%;
      height: 100%;
      min-height: 0;
      min-width: 0;
    }

    /* TARJETAS DE EQUIPO */
    .team-card {
      background: var(--arena-card);
      border: 3px solid var(--border-dark);
      border-radius: 12px;
      display: grid;
      grid-template-rows: 72px 1fr 92px;
      padding: 12px;
      gap: 10px;
      height: 100%;
      min-height: 0;
      min-width: 0;
      position: relative;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
    }

    .team-card.local { border-color: #0b4a2b; }
    .team-card.visita { border-color: #5a0e1c; }

    .team-top-strip {
      background: var(--arena-card-inner);
      border: 2px solid #1f2533;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18px;
      height: 100%;
      min-height: 0;
    }

    .team-badge-name {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .team-color-indicator {
      width: 8px;
      height: 34px;
      border-radius: 4px;
    }

    .local .team-color-indicator {
      background: var(--color-local);
      box-shadow: 0 0 12px var(--color-local);
    }

    .visita .team-color-indicator {
      background: var(--color-visita);
      box-shadow: 0 0 12px var(--color-visita);
    }

    .team-name {
      font-family: 'Teko', sans-serif;
      font-size: clamp(38px, 4.2vw, 54px);
      letter-spacing: 4px;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .local .team-name { color: var(--color-local); }
    .visita .team-name { color: var(--color-visita); }

    .bonus-flag {
      font-family: 'Teko', sans-serif;
      font-size: 26px;
      letter-spacing: 2px;
      padding: 2px 16px;
      border-radius: 4px;
      background: #101319;
      color: #3e4759;
      border: 2px solid #232938;
      line-height: 1;
      transition: all 0.2s;
    }

    .bonus-flag.active {
      background: var(--color-visita);
      color: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 0 25px var(--color-visita);
    }

    /* CONTENEDOR DE PUNTOS RÍGIDO (CERO DEFORMACIÓN) */
    .score-arena-box {
      background: #000000;
      border: 3px solid #161a24;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      position: relative;
    }

    .score-giant-number {
      font-family: 'Teko', sans-serif;
      font-size: clamp(140px, 19vw, 290px);
      font-weight: 700;
      line-height: 0.8;
      letter-spacing: -2px;
      text-align: center;
      width: 100%;
      z-index: 2;
    }

    .local .score-giant-number {
      color: var(--color-local);
      text-shadow: 0 0 35px var(--color-local-glow);
    }

    .visita .score-giant-number {
      color: var(--color-visita);
      text-shadow: 0 0 35px var(--color-visita-glow);
    }

    /* FOOTER DE FALTAS */
    .team-fouls-strip {
      background: var(--arena-card-inner);
      border: 2px solid #1f2533;
      border-radius: 8px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      padding: 0 18px;
      gap: 16px;
      height: 100%;
      min-height: 0;
    }

    .fouls-caption {
      font-family: 'Teko', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      color: #8391a8;
      line-height: 1;
    }

    .foul-pills-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      height: 28px;
      align-items: center;
    }

    .foul-pill-cell {
      height: 100%;
      background: var(--led-off);
      border: 2px solid #232938;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .foul-pill-cell.active {
      background: var(--led-on-amber);
      border-color: #ffffff;
      box-shadow: 0 0 14px var(--led-on-amber);
    }

    .foul-pill-cell.penalty {
      background: var(--led-on-red);
      border-color: #ffffff;
      box-shadow: 0 0 16px var(--led-on-red);
    }

    .fouls-counter-num {
      font-family: 'Teko', sans-serif;
      font-size: 52px;
      line-height: 1;
      color: var(--color-clock);
      min-width: 32px;
      text-align: right;
    }

    /* 3. COLUMNA CENTRAL: RELOJ, CUARTO Y BOCINA */
    .match-center-column {
      display: grid;
      grid-template-rows: 1.45fr 1fr;
      gap: 12px;
      height: 100%;
      min-height: 0;
      min-width: 0;
    }

    .clock-vault-card {
      background: var(--arena-card);
      border: 3px solid #2a3345;
      border-radius: 12px;
      display: grid;
      grid-template-rows: 34px 1fr 36px;
      padding: 10px 14px;
      gap: 6px;
      height: 100%;
      min-height: 0;
      min-width: 0;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
    }

    .clock-vault-header {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #8391a8;
      text-align: center;
      line-height: 1;
    }

    .clock-digits-cage {
      background: #000000;
      border: 3px solid #161a24;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
    }

    .clock-primary-time {
      font-family: 'Teko', sans-serif;
      font-size: clamp(60px, 8.5vw, 130px);
      font-weight: 700;
      color: var(--color-clock);
      text-shadow: 0 0 35px var(--color-clock-glow);
      line-height: 0.85;
      letter-spacing: 2px;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clock-status-banner {
      font-family: 'Teko', sans-serif;
      font-size: 24px;
      letter-spacing: 3px;
      text-align: center;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .clock-status-banner.running { color: var(--color-local); }
    .clock-status-banner.stopped { color: #ff3344; }

    /* CUARTO Y BOCINA */
    .sub-center-card {
      background: var(--arena-card);
      border: 3px solid #2a3345;
      border-radius: 12px;
      display: grid;
      grid-template-rows: 1fr 48px;
      padding: 10px;
      gap: 10px;
      height: 100%;
      min-height: 0;
      min-width: 0;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
    }

    .period-cube {
      background: #000000;
      border: 3px solid #161a24;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 0;
    }

    .period-title-tag {
      font-size: 13px;
      letter-spacing: 3px;
      color: #8391a8;
      font-weight: 800;
      line-height: 1;
    }

    .period-big-num {
      font-family: 'Teko', sans-serif;
      font-size: clamp(65px, 8.5vw, 105px);
      line-height: 0.85;
      color: var(--color-period);
      text-shadow: 0 0 25px rgba(0, 229, 255, 0.6);
    }

    .stadium-horn-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--arena-card-inner);
      border: 2px solid #1f2533;
      border-radius: 6px;
      font-family: 'Teko', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      color: #556277;
      line-height: 1;
      transition: all 0.15s ease;
    }

    .stadium-horn-banner.active {
      background: var(--color-clock);
      border-color: #ffffff;
      color: #000000;
      box-shadow: 0 0 35px var(--color-clock);
    }

    /* MARCO BUZZER BEATER PERIMETRAL */
    #buzzerBeaterFrame {
      position: fixed;
      inset: 0;
      border: 14px solid transparent;
      pointer-events: none;
      z-index: 99999;
      transition: border-color 0.1s;
    }

    #buzzerBeaterFrame.active {
      border-color: #ff2247;
      box-shadow: inset 0 0 100px #ff2247;
    }
  </style>
</head>
<body>

  <!-- Marco de Fin de Cuarto / Bocina -->
  <div id="buzzerBeaterFrame"></div>

  <!-- Contenedor Maestro Kiosco -->
  <div class="arena-scoreboard">

    <!-- 1. HEADER: LOGO Y COCKPIT DE MANDO -->
    <header class="arena-header">
      <div class="brand-section">
        <div class="brand-ball">🏀</div>
        <div class="brand-title">TABLERO <span>MONTMARTRE</span></div>
      </div>

      <div id="mandoCockpit" class="mando-cockpit disconnected">
        <div class="radar-dot"></div>
        <div id="mandoCockpitText" class="mando-text">MANDO: DESCONECTADO</div>
      </div>

      <div class="header-actions">
        <span>SISTEMA FIBA OFICIAL</span>
      </div>
    </header>

    <!-- 2. CUERPO PRINCIPAL (LOCAL | MATCH CENTER | VISITA) -->
    <main class="arena-grid">
      <!-- EQUIPO LOCAL -->
      <section class="team-card local">
        <div class="team-top-strip">
          <div class="team-badge-name">
            <div class="team-color-indicator"></div>
            <div class="team-name" spellcheck="false">LOCAL</div>
          </div>
          <div id="localBonusFlag" class="bonus-flag">BONUS</div>
        </div>

        <div class="score-arena-box">
          <div id="scoreLocal" class="score-giant-number">0</div>
        </div>

        <div class="team-fouls-strip">
          <div class="fouls-caption">FALTAS</div>
          <div class="foul-pills-row" id="pillsLocalFouls">
            <div class="foul-pill-cell"></div>
            <div class="foul-pill-cell"></div>
            <div class="foul-pill-cell"></div>
            <div class="foul-pill-cell"></div>
            <div class="foul-pill-cell penalty"></div>
          </div>
          <div id="numLocalFouls" class="fouls-counter-num">0</div>
        </div>
      </section>

      <!-- MATCH CENTER -->
      <section class="match-center-column">
        <!-- RELOJ -->
        <div class="clock-vault-card">
          <div class="clock-vault-header">TIEMPO DE JUEGO</div>
          <div class="clock-digits-cage">
            <div id="clockDisplay" class="clock-primary-time">10:00</div>
          </div>
          <div id="clockStatusBanner" class="clock-status-banner stopped">
            <span>■</span> TIEMPO DETENIDO
          </div>
        </div>

        <!-- CUARTO Y BOCINA -->
        <div class="sub-center-card">
          <div class="period-cube">
            <div class="period-title-tag">CUARTO / PERIODO</div>
            <div id="periodDisplay" class="period-big-num">1</div>
          </div>
          <div id="stadiumHornBanner" class="stadium-horn-banner">
            <span>📢</span>
            <span id="stadiumHornText">BOCINA INACTIVA</span>
          </div>
        </div>
      </section>

      <!-- EQUIPO VISITA -->
      <section class="team-card visita">
        <div class="team-top-strip">
          <div class="team-badge-name">
            <div class="team-color-indicator"></div>
            <div class="team-name" spellcheck="false">VISITA</div>
          </div>
          <div id="visitaBonusFlag" class="bonus-flag">BONUS</div>
        </div>

        <div class="score-arena-box">
          <div id="scoreVisita" class="score-giant-number">0</div>
        </div>

        <div class="team-fouls-strip">
          <div class="fouls-caption">FALTAS</div>
          <div class="foul-pills-row" id="pillsVisitaFouls">
            <div class="foul-pill-cell"></div>
            <div class="foul-pill-cell"></div>
            <div class="foul-pill-cell"></div>
            <div class="foul-pill-cell"></div>
            <div class="foul-pill-cell penalty"></div>
          </div>
          <div id="numVisitaFouls" class="fouls-counter-num">0</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // ============================================================
    // ESTADO DEL MARCADOR
    // ============================================================
    const state = {
      scoreLocal: 0,
      scoreVisita: 0,
      foulsLocal: 0,
      foulsVisita: 0,
      period: 1,
      timeRemainingMs: 10 * 60 * 1000,
      defaultPresetMs: 10 * 60 * 1000,
      isClockRunning: false,
      lastTickTime: 0,
      clockInterval: null,
      isHornActive: false,
      hornTimer: null
    };

    // DOM ELEMENTS
    const elScoreLocal = document.getElementById('scoreLocal');
    const elScoreVisita = document.getElementById('scoreVisita');
    const elNumLocalFouls = document.getElementById('numLocalFouls');
    const elNumVisitaFouls = document.getElementById('numVisitaFouls');
    const elPillsLocal = document.getElementById('pillsLocalFouls').children;
    const elPillsVisita = document.getElementById('pillsVisitaFouls').children;
    const elLocalBonus = document.getElementById('localBonusFlag');
    const elVisitaBonus = document.getElementById('visitaBonusFlag');
    const elClockDisplay = document.getElementById('clockDisplay');
    const elClockStatusBanner = document.getElementById('clockStatusBanner');
    const elPeriodDisplay = document.getElementById('periodDisplay');
    const elHornBanner = document.getElementById('stadiumHornBanner');
    const elHornText = document.getElementById('stadiumHornText');
    const elBuzzerFrame = document.getElementById('buzzerBeaterFrame');
    const elMandoCockpit = document.getElementById('mandoCockpit');
    const elMandoCockpitText = document.getElementById('mandoCockpitText');

    // ============================================================
    // SINTETIZADOR DE AUDIO PARA BOCINA REAL
    // ============================================================
    let audioCtx = null;
    let hornNodes = null;

    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function startStadiumHornAudio() {
      try {
        const ctx = getAudioContext();
        if (hornNodes) stopStadiumHornAudio();

        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(260, ctx.currentTime);
        osc2.type = 'sawtooth';
        osc2.frequency.setValueAtTime(390, ctx.currentTime);

        gain.gain.setValueAtTime(0.45, ctx.currentTime);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);

        osc1.start();
        osc2.start();
        hornNodes = { osc1, osc2, gain };
      } catch (e) {}
    }

    function stopStadiumHornAudio() {
      if (hornNodes) {
        try {
          hornNodes.osc1.stop();
          hornNodes.osc2.stop();
          hornNodes.gain.disconnect();
        } catch (e) {}
        hornNodes = null;
      }
    }

    // ============================================================
    // DISPARO DE BOCINA FISICA & VISUAL
    // ============================================================
    function triggerHorn(durationMs = 2000, triggerHardware = false) {
      state.isHornActive = true;
      elHornBanner.classList.add('active');
      elHornText.innerText = '¡¡ BOCINA ACTIVADA !!';
      elBuzzerFrame.classList.add('active');

      startStadiumHornAudio();

      // Enviar orden a la ESP32 para que el relé físico del Pin 4 suene
      if (triggerHardware) {
        if (typeof require !== 'undefined') {
          try {
            const { ipcRenderer } = require('electron');
            ipcRenderer.send('virtual-command', { cmd: 6, team: 0, player: 0, value: 0 });
          } catch(e) {}
        }
      }

      if (state.hornTimer) clearTimeout(state.hornTimer);
      state.hornTimer = setTimeout(() => {
        state.isHornActive = false;
        elHornBanner.classList.remove('active');
        elHornText.innerText = 'BOCINA INACTIVA';
        elBuzzerFrame.classList.remove('active');
        stopStadiumHornAudio();
        state.hornTimer = null;
      }, durationMs);
    }

    // ============================================================
    // MOTOR DE RELOJ
    // ============================================================
    function formatTime(ms) {
      if (ms <= 0) return "00.0";
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      const tenths = Math.floor((ms % 1000) / 100);

      const secStr = seconds < 10 ? '0' + seconds : seconds;
      if (minutes === 0) {
        return `${secStr}.${tenths}`;
      } else {
        const minStr = minutes < 10 ? '0' + minutes : minutes;
        return `${minStr}:${secStr}`;
      }
    }

    function updateClockDisplay() {
      elClockDisplay.innerText = formatTime(state.timeRemainingMs);
    }

    function startClock() {
      if (state.isClockRunning || state.timeRemainingMs <= 0) return;
      state.isClockRunning = true;
      state.lastTickTime = performance.now();

      elClockStatusBanner.className = 'clock-status-banner running';
      elClockStatusBanner.innerHTML = '<span>●</span> EN JUEGO';

      state.clockInterval = setInterval(() => {
        const now = performance.now();
        const delta = now - state.lastTickTime;
        state.lastTickTime = now;

        state.timeRemainingMs -= delta;

        if (state.timeRemainingMs <= 0) {
          state.timeRemainingMs = 0;
          stopClock();
          updateClockDisplay();
          triggerHorn(2500, true); // Suena la bocina física de la ESP32 al llegar a 00:00
          return;
        }

        updateClockDisplay();
      }, 50);
    }

    function stopClock() {
      state.isClockRunning = false;
      if (state.clockInterval) {
        clearInterval(state.clockInterval);
        state.clockInterval = null;
      }
      elClockStatusBanner.className = 'clock-status-banner stopped';
      elClockStatusBanner.innerHTML = '<span>■</span> TIEMPO DETENIDO';
      updateClockDisplay();
    }

    function toggleClock() {
      if (state.isClockRunning) {
        stopClock();
      } else {
        startClock();
      }
    }

    // ============================================================
    // ACTUALIZACION GRAFICA
    // ============================================================
    function renderUi() {
      elScoreLocal.innerText = state.scoreLocal;
      elScoreVisita.innerText = state.scoreVisita;

      elNumLocalFouls.innerText = state.foulsLocal;
      for (let i = 0; i < elPillsLocal.length; i++) {
        if (i < state.foulsLocal) {
          elPillsLocal[i].classList.add(i === 4 ? 'penalty' : 'active');
        } else {
          elPillsLocal[i].classList.remove('active', 'penalty');
        }
      }
      elLocalBonus.classList.toggle('active', state.foulsLocal >= 5);

      elNumVisitaFouls.innerText = state.foulsVisita;
      for (let i = 0; i < elPillsVisita.length; i++) {
        if (i < state.foulsVisita) {
          elPillsVisita[i].classList.add(i === 4 ? 'penalty' : 'active');
        } else {
          elPillsVisita[i].classList.remove('active', 'penalty');
        }
      }
      elVisitaBonus.classList.toggle('active', state.foulsVisita >= 5);

      elPeriodDisplay.innerText = state.period > 4 ? `OT${state.period - 4}` : state.period;

      updateClockDisplay();
    }

    // ============================================================
    // COCKPIT DE MANDO (SINCRONIZACION Y LATIDO DEL CELULAR)
    // ============================================================
    let mandoTimeout = null;

    function registerMandoHeartbeat() {
      elMandoCockpit.className = 'mando-cockpit connected';
      elMandoCockpitText.innerText = 'MANDO: CONECTADO';

      if (mandoTimeout) clearTimeout(mandoTimeout);
      mandoTimeout = setTimeout(() => {
        elMandoCockpit.className = 'mando-cockpit disconnected';
        elMandoCockpitText.innerText = 'MANDO: DESCONECTADO';
      }, 3500);
    }

    // ============================================================
    // PROCESAMIENTO DEL PROTOCOLO DE 5 BYTES DE LA ESP32
    // ============================================================
    function processCommand(c, t, p, v) {
      registerMandoHeartbeat();

      switch (c) {
        case 1: // PUNTOS (+1, +2, +3, -1)
          {
            const delta = v === 255 ? -1 : v;
            if (t === 1) state.scoreLocal = Math.max(0, state.scoreLocal + delta);
            else if (t === 2) state.scoreVisita = Math.max(0, state.scoreVisita + delta);
          }
          break;

        case 3: // FALTAS (+1, -1)
          {
            const delta = v === 255 ? -1 : v;
            if (t === 1) state.foulsLocal = Math.max(0, state.foulsLocal + delta);
            else if (t === 2) state.foulsVisita = Math.max(0, state.foulsVisita + delta);
          }
          break;

        case 4: // TOGGLE START / STOP
          toggleClock();
          break;

        case 12: // START
          startClock();
          break;

        case 13: // STOP
          stopClock();
          break;

        case 6: // BOCINA (la ESP32 ya la encendio al recibir la peticion HTTP)
          triggerHorn(2000, false);
          break;

        case 7: // PRESET DE TIEMPO
          stopClock();
          state.timeRemainingMs = t * 60 * 1000;
          state.defaultPresetMs = state.timeRemainingMs;
          break;

        case 8: // AJUSTE DE MINUTOS
          {
            const deltaMins = v === 255 ? -1 : v;
            state.timeRemainingMs = Math.max(0, state.timeRemainingMs + (deltaMins * 60 * 1000));
          }
          break;

        case 5: // PERIODO
          {
            const delta = v === 255 ? -1 : v;
            state.period = Math.max(1, state.period + delta);
          }
          break;

        case 9: // RESET A CERO
          stopClock();
          state.scoreLocal = 0;
          state.scoreVisita = 0;
          state.foulsLocal = 0;
          state.foulsVisita = 0;
          state.period = 1;
          state.timeRemainingMs = state.defaultPresetMs;
          break;

        case 200: // KEEPALIVE DEL CELULAR
          break;
      }

      renderUi();
    }

    // ============================================================
    // CONEXION NATIVA CON ELECTRON (MODO KIOSCO EN DEBIAN / PENDRIVE)
    // ============================================================
    if (typeof require !== 'undefined') {
      try {
        const { ipcRenderer } = require('electron');
        ipcRenderer.on('serial-command', (event, data) => {
          processCommand(data.cmd, data.team, data.player, data.value);
        });
        ipcRenderer.on('mando-status', (event, data) => {
          if (data.connected) registerMandoHeartbeat();
        });
      } catch(e) {}
    }

    renderUi();
  </script>
</body>
</html>
